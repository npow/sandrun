[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandrun"
version = "0.1.2"
description = "Run code in fast, isolated cloud sandboxes — zero Metaflow dependency"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "npow" },
]
keywords = [
    "sandbox",
    "daytona",
    "e2b",
    "cloud",
    "containers",
    "isolation",
    "remote-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
sandrun = "sandrun.cli:main"

[project.optional-dependencies]
daytona = ["daytona>=0.1"]
e2b = ["e2b-code-interpreter>=1.0"]
boxlite = ["boxlite[sync]>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sandrun"]

[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["sandrun"]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require sandbox credentials",
]

[tool.coverage.run]
source = ["src/sandrun"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# The backend modules import optional 3rd-party sandbox SDKs (`e2b_code_interpreter`,
# `daytona`, `boxlite`) that don't ship type stubs. Without overrides, mypy types
# those imports as `object` and then flags every attribute access on the SDK
# clients. Each backend is exercised by its own integration tests against the
# real SDK; suppress the missing-stub noise so static checks don't block CI.
[[tool.mypy.overrides]]
module = [
    "e2b_code_interpreter",
    "e2b.sandbox.commands.command_handle",
    "daytona",
    "boxlite",
    "boxlite.sync_api",
]
ignore_missing_imports = true

# The backend modules consume the SDKs above as untyped Any. disallow_untyped_defs
# + warn_return_any cascade into noise. Disable strict checks for these files only.
[[tool.mypy.overrides]]
module = [
    "sandrun.backends.e2b",
    "sandrun.backends.daytona",
    "sandrun.backends.boxlite",
]
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["attr-defined", "no-any-return"]
