[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandrun"
version = "0.1.0"
description = "Run code in fast, isolated cloud sandboxes — zero Metaflow dependency"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "npow" },
]
keywords = [
    "sandbox",
    "daytona",
    "e2b",
    "cloud",
    "containers",
    "isolation",
    "remote-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
daytona = ["daytona>=0.1"]
e2b = ["e2b-code-interpreter>=1.0"]
boxlite = ["boxlite[sync]>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sandrun"]

[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["sandrun"]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require sandbox credentials",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
